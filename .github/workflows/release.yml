name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN: iphone-whatsapp-media-extractor

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # rust-toolchain.toml pins the toolchain used by cargo, so make sure
      # both targets are installed for that toolchain too.
      - name: Add targets for pinned toolchain
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target "$target" -p iphone-whatsapp-media-extractor -p iwme-app
          done

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          APP_NAME="iPhone WhatsApp Media Extractor"
          mkdir -p dist universal

          for bin in "${BIN}" iwme-app; do
            lipo -create \
              "target/aarch64-apple-darwin/release/${bin}" \
              "target/x86_64-apple-darwin/release/${bin}" \
              -output "universal/${bin}"
            lipo -info "universal/${bin}"
          done

          # App bundle (ad-hoc signed), zip and dmg
          scripts/bundle-macos.sh universal/iwme-app "${VERSION}" universal
          ditto -c -k --keepParent "universal/${APP_NAME}.app" "dist/iPhone-WhatsApp-Media-Extractor-macos.zip"
          mkdir -p dmg
          cp -R "universal/${APP_NAME}.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "${APP_NAME}" -srcfolder dmg -ov -format UDZO \
            "dist/iPhone-WhatsApp-Media-Extractor-macos.dmg"

          # CLI tarball
          name="${BIN}-macos-universal"
          mkdir -p "dist/${name}"
          cp "universal/${BIN}" README.md LICENSE "dist/${name}/"
          chmod +x "dist/${name}/${BIN}"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          rm -rf "dist/${name}"

          cd dist
          for f in *.zip *.dmg *.tar.gz; do shasum -a 256 "$f" > "$f.sha256"; done
          ls -l

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.dmg
            dist/*.tar.gz
            dist/*.sha256

      - name: Upload artifacts (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/*
