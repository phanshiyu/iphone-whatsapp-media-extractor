name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN: iphone-whatsapp-media-extractor

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # rust-toolchain.toml pins the toolchain used by cargo, so make sure
      # both targets are installed for that toolchain too.
      - name: Add targets for pinned toolchain
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build aarch64
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Build x86_64
        run: cargo build --release --locked --target x86_64-apple-darwin

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist universal

          lipo -create \
            "target/aarch64-apple-darwin/release/${BIN}" \
            "target/x86_64-apple-darwin/release/${BIN}" \
            -output "universal/${BIN}"
          lipo -info "universal/${BIN}"

          package() {
            local name="$1" binary="$2"
            local dir="dist/${name}"
            mkdir -p "${dir}"
            cp "${binary}" "${dir}/${BIN}"
            chmod +x "${dir}/${BIN}"
            cp README.md LICENSE "${dir}/"
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
            rm -rf "${dir}"
          }

          package "${BIN}-${TAG}-macos-universal" "universal/${BIN}"
          package "${BIN}-${TAG}-macos-aarch64" "target/aarch64-apple-darwin/release/${BIN}"
          package "${BIN}-${TAG}-macos-x86_64" "target/x86_64-apple-darwin/release/${BIN}"

          cd dist
          for f in *.tar.gz; do shasum -a 256 "$f" > "$f.sha256"; done
          ls -l

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256

      - name: Upload artifacts (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/*
