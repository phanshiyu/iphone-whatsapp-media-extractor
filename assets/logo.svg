<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t">
  <title id="t">A goofy smartphone with googly eyes spitting photos into folders</title>
  <!-- background -->
  <rect x="8" y="8" width="496" height="496" rx="96" fill="#FFF3C4" stroke="#2B2B3A" stroke-width="10"/>
  <g fill="#FF8FB1" stroke="#2B2B3A" stroke-width="4" stroke-linejoin="round">
    <circle cx="62" cy="64" r="9"/>
    <circle cx="452" cy="58" r="11" fill="#7FD8BE"/>
    <path d="M440 150 l10 -20 l10 20z"/>
  </g>
  <g fill="none" stroke="#2B2B3A" stroke-width="5" stroke-linecap="round">
    <path d="M98 150 q8 -14 16 0 t16 0"/>
    <path d="M395 100 l14 -8 M398 118 l18 0 M395 136 l14 8"/>
  </g>

  <g stroke="#2B2B3A" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
    <!-- folder backs -->
    <path d="M30 400 h54 l14 -18 h62 a12 12 0 0 1 12 12 v90 h-142z" fill="#F4B63F"/>
    <path d="M190 400 h54 l14 -18 h62 a12 12 0 0 1 12 12 v90 h-142z" fill="#FF8FB1"/>
    <path d="M350 400 h54 l14 -18 h62 a12 12 0 0 1 12 12 v90 h-142z" fill="#7FD8BE"/>

    <!-- photos flying -->
    <g transform="rotate(-24 84 300)">
      <rect x="40" y="228" width="92" height="108" rx="6" fill="#fff"/>
      <rect x="50" y="238" width="72" height="68" fill="#8AD1FF" stroke-width="5"/>
      <path d="M50 306 l22 -26 l16 16 l12 -12 l22 22z" fill="#5CC48A" stroke-width="5"/>
      <circle cx="102" cy="260" r="8" fill="#FFD84D" stroke-width="4"/>
    </g>
    <g transform="rotate(20 430 300)">
      <rect x="384" y="236" width="92" height="108" rx="6" fill="#fff"/>
      <rect x="394" y="246" width="72" height="68" fill="#FFB38A" stroke-width="5"/>
      <path d="M394 314 l24 -30 l18 20 l14 -14 l16 24z" fill="#B58CE8" stroke-width="5"/>
      <circle cx="418" cy="266" r="8" fill="#fff" stroke-width="4"/>
    </g>
    <!-- film frame, tumbling -->
    <g transform="rotate(-12 256 372)">
      <rect x="218" y="338" width="76" height="68" rx="5" fill="#3B3B52"/>
      <rect x="230" y="348" width="52" height="38" fill="#FFD84D" stroke-width="4"/>
      <g fill="#FFF3C4" stroke-width="0">
        <rect x="224" y="392" width="8" height="8"/><rect x="240" y="392" width="8" height="8"/>
        <rect x="256" y="392" width="8" height="8"/><rect x="272" y="392" width="8" height="8"/>
      </g>
    </g>
    <!-- small photo already in the pink folder -->
    <g transform="rotate(8 330 372)">
      <rect x="298" y="344" width="56" height="64" rx="4" fill="#fff" stroke-width="6"/>
      <rect x="306" y="352" width="40" height="34" fill="#8AD1FF" stroke-width="4"/>
    </g>

    <!-- folder fronts -->
    <path d="M30 424 h142 v68 a12 12 0 0 1 -12 12 h-118 a12 12 0 0 1 -12 -12z" fill="#FFCB5C"/>
    <path d="M190 424 h142 v68 a12 12 0 0 1 -12 12 h-118 a12 12 0 0 1 -12 -12z" fill="#FFB0C8"/>
    <path d="M350 424 h142 v68 a12 12 0 0 1 -12 12 h-118 a12 12 0 0 1 -12 -12z" fill="#A3E8D2"/>

    <!-- phone -->
    <g transform="rotate(-5 256 190)">
      <rect x="148" y="30" width="216" height="300" rx="44" fill="#3B3B52"/>
      <rect x="164" y="50" width="184" height="260" rx="30" fill="#7FE0B0" stroke-width="6"/>
      <!-- notch / brow -->
      <rect x="226" y="58" width="60" height="14" rx="7" fill="#2B2B3A" stroke-width="0"/>
      <!-- googly eyes -->
      <circle cx="214" cy="130" r="38" fill="#fff"/>
      <circle cx="302" cy="124" r="32" fill="#fff"/>
      <circle cx="226" cy="144" r="15" fill="#2B2B3A" stroke-width="0"/>
      <circle cx="290" cy="112" r="13" fill="#2B2B3A" stroke-width="0"/>
      <circle cx="221" cy="138" r="4" fill="#fff" stroke-width="0"/>
      <circle cx="286" cy="108" r="3.5" fill="#fff" stroke-width="0"/>
      <!-- big grin -->
      <path d="M184 200 Q256 196 328 200 Q326 288 256 290 Q186 288 184 200z" fill="#2B2B3A"/>
      <path d="M200 203 h112 v14 h-112z" fill="#fff" stroke-width="0"/>
      <!-- chat-bubble tongue -->
      <path d="M222 268 Q222 244 256 244 Q290 244 290 266 Q290 288 262 289 L246 304 L248 288 Q222 286 222 268z" fill="#25D366" stroke-width="6"/>
      <!-- blush -->
      <ellipse cx="190" cy="186" rx="12" ry="7" fill="#FF8FB1" stroke-width="0"/>
      <ellipse cx="324" cy="182" rx="12" ry="7" fill="#FF8FB1" stroke-width="0"/>
    </g>
  </g>
</svg>
